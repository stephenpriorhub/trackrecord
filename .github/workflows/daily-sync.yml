name: Daily Airtable Sync

# Keeps the track record fresh by POSTing the deployed /api/sync endpoint on a schedule.
# This scheduler lives in GitHub, NOT Railway — it calls the already-running app, so it
# never needs a redeploy to work and won't break when Railway redeploys.
#
# One-time setup (Repo → Settings → Secrets and variables → Actions):
#   - Secret   SYNC_API_KEY  = the same value as the app's SYNC_API_KEY env var on Railway
#   - Variable APP_URL       = the deployed base URL (e.g. https://trackrecord.oxfordhub.app)
#                              If unset, it falls back to the default guess below.

on:
  schedule:
    # Times are UTC. Runs pre-market, midday, and post-close ET so data stays current
    # even if GitHub delays one run (scheduled crons are best-effort, not exact).
    - cron: '0 12,17,22 * * *'
  workflow_dispatch:      # allows manual "Run workflow" from the Actions tab
    inputs:
      managed_pubs:
        description: "Publications to pull into Portfolio Manager (space-separated)"
        required: false
        default: ""
      managed_dry_run:
        description: "Preview the Portfolio Manager pull without writing anything"
        type: boolean
        required: false
        default: true

concurrency:
  group: airtable-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://trackrecord.oxfordhub.app}"
          if [ -z "${SYNC_API_KEY}" ]; then
            echo "::error::SYNC_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Triggering sync at ${BASE_URL}/api/sync"
          # The endpoint returns 202 immediately and runs the sync in the background.
          HTTP_CODE=$(curl -sS -o /tmp/sync_resp.txt -w "%{http_code}" \
            -X POST "${BASE_URL}/api/sync" \
            -H "x-sync-key: ${SYNC_API_KEY}" \
            --max-time 60)
          echo "Response (${HTTP_CODE}): $(cat /tmp/sync_resp.txt)"
          if [ "${HTTP_CODE}" != "202" ] && [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Sync trigger failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "Sync accepted."

      - name: Pull Airtable trades into Portfolio Manager
        # Scheduled runs only once repo variable MANAGED_SYNC_ENABLED is "true",
        # so nothing is applied before a dry run has been reviewed. A manual run
        # always works, and previews unless managed_dry_run is unticked.
        if: ${{ github.event_name == 'workflow_dispatch' || vars.MANAGED_SYNC_ENABLED == 'true' }}
        # The embeds read Portfolio Manager, not the Airtable mirror above. This
        # brings Airtable-sourced positions up to date (new positions, partial
        # exits, closes). See lib/managed/airtable-sync.ts for what it never
        # touches. Publications: the dispatch input, else repo variable
        # MANAGED_SYNC_PUBS, else XAI.
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          PUBS: ${{ inputs.managed_pubs || vars.MANAGED_SYNC_PUBS || 'XAI' }}
          # Scheduled runs have no inputs, so this is only "true" on a manual preview.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.managed_dry_run }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_URL:-https://trackrecord.oxfordhub.app}"
          for PUB in ${PUBS}; do
            if [ "${DRY_RUN}" = "true" ]; then QS="pubCode=${PUB}"; OK="200"; else QS="pubCode=${PUB}&apply=1"; OK="202"; fi
            HTTP_CODE=$(curl -sS -o /tmp/managed_resp.txt -w "%{http_code}" \
              -X POST "${BASE_URL}/api/managed-sync?${QS}" \
              -H "x-sync-key: ${SYNC_API_KEY}" \
              --max-time 280)
            echo "${PUB} (${HTTP_CODE}):"
            cat /tmp/managed_resp.txt; echo
            if [ "${HTTP_CODE}" != "${OK}" ]; then
              echo "::error::Portfolio Manager sync for ${PUB} failed with HTTP ${HTTP_CODE}"
              exit 1
            fi
          done
